<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TempMail Inbox</title>
  <style>
    :root {
      --bg-0: #f6f9f7;
      --bg-1: #ffffff;
      --text: #143021;
      --muted: #547062;
      --brand: #0d9f6e;
      --brand-2: #067651;
      --line: #dce9e2;
      --danger: #a94442;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", "Tahoma", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, #d8f3e7 0%, transparent 35%),
        radial-gradient(circle at 85% 0%, #e3f2fd 0%, transparent 25%),
        var(--bg-0);
      min-height: 100vh;
    }

    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 14px;
    }

    .wrap.focused {
      grid-template-columns: 1fr;
    }

    .wrap.focused .email-panel {
      display: none;
    }

    .panel {
      background: var(--bg-1);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 8px 22px rgba(10, 76, 52, 0.08);
      overflow: hidden;
    }

    .panel-head {
      padding: 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .mail-head-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .head-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      border: 2px solid #d5eadd;
      object-fit: cover;
      background: #eaf7f1;
      box-shadow: 0 3px 8px rgba(9, 80, 58, 0.15);
    }

    .avatar-fallback {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      border: 2px solid #d5eadd;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #1f6a4d;
      background: #eaf7f1;
      box-shadow: 0 3px 8px rgba(9, 80, 58, 0.15);
    }

    .title {
      font-size: 17px;
      font-weight: 700;
      margin: 0;
      letter-spacing: 0.2px;
    }

    .sub {
      color: var(--muted);
      font-size: 12px;
      margin: 2px 0 0;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--brand);
      background: linear-gradient(180deg, var(--brand), var(--brand-2));
      color: #fff;
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secondary {
      border-color: #8baea0;
      background: #eef6f2;
      color: #1f5b44;
      display: none;
    }

    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .emails {
      max-height: calc(100vh - 140px);
      overflow: auto;
      padding: 8px;
    }

    .email-item {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      background: #fff;
    }

    .email-item:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(9, 80, 58, 0.1);
    }

    .email-item.active {
      border-color: var(--brand);
      box-shadow: inset 0 0 0 1px var(--brand);
      background: #f1fbf7;
    }

    .pill {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 11px;
      background: #eaf7f1;
      color: #23694f;
      margin-top: 5px;
    }

    .list {
      max-height: calc(100vh - 140px);
      overflow: auto;
      padding: 10px;
    }

    .mail {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px;
      margin-bottom: 10px;
      background: #fff;
    }

    .mail h4 {
      margin: 0 0 6px;
      font-size: 14px;
      color: #0f422f;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 7px;
      line-height: 1.4;
      word-break: break-word;
    }

    .body {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.42;
      font-size: 13px;
    }

    .empty {
      padding: 26px 16px;
      color: var(--muted);
      text-align: center;
    }

    .error {
      color: var(--danger);
      padding: 12px;
      font-size: 13px;
    }

    @media (max-width: 860px) {
      .wrap {
        grid-template-columns: 1fr;
      }
      .emails,
      .list {
        max-height: none;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="panel email-panel">
      <div class="panel-head">
        <div>
          <h1 class="title">Inbox Addresses</h1>
          <p class="sub" id="userLine">Loading profile...</p>
        </div>
        <div class="head-right">
          <button class="btn" id="refreshBtn">Refresh</button>
          <img id="profileAvatar" class="avatar" alt="Profile" />
          <div id="profileAvatarFallback" class="avatar-fallback">U</div>
        </div>
      </div>
      <div id="emails" class="emails"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div class="mail-head-left">
          <button class="btn btn-secondary" id="backBtn">Back</button>
          <div>
          <h2 class="title" id="mailTitle">Select an email</h2>
          <p class="sub">Latest messages</p>
          </div>
        </div>
      </div>
      <div id="mails" class="list"></div>
    </section>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token") || "";

    const wrapEl = document.querySelector(".wrap");
    const emailsEl = document.getElementById("emails");
    const mailsEl = document.getElementById("mails");
    const userLineEl = document.getElementById("userLine");
    const profileAvatarEl = document.getElementById("profileAvatar");
    const profileAvatarFallbackEl = document.getElementById("profileAvatarFallback");
    const mailTitleEl = document.getElementById("mailTitle");
    const backBtn = document.getElementById("backBtn");
    const refreshBtn = document.getElementById("refreshBtn");

    let selectedEmail = "";

    function setFocusedMode(enabled) {
      if (enabled) {
        wrapEl.classList.add("focused");
        backBtn.style.display = "inline-flex";
      } else {
        wrapEl.classList.remove("focused");
        backBtn.style.display = "none";
      }
    }

    function htmlEscape(input) {
      return String(input || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    async function api(path) {
      const res = await fetch(`${path}${path.includes("?") ? "&" : "?"}token=${encodeURIComponent(token)}`);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.error || "Request failed");
      }
      return data;
    }

    function renderEmails(inbox) {
      if (!inbox.length) {
        emailsEl.innerHTML = '<div class="empty">No active emails yet. Generate one in bot with /generate.</div>';
        return;
      }

      emailsEl.innerHTML = inbox.map((row) => {
        const latestSubject = row.latest && row.latest.subject ? htmlEscape(row.latest.subject) : "No messages";
        const accessText = row.accessType === "owner" ? "owner" : "shared";
        const active = row.email === selectedEmail ? "active" : "";
        return `
          <div class="email-item ${active}" data-email="${htmlEscape(row.email)}">
            <div><strong>${htmlEscape(row.email)}</strong></div>
            <div class="pill">${accessText}</div>
            <div class="sub" style="margin-top:6px">${latestSubject}</div>
          </div>
        `;
      }).join("");

      emailsEl.querySelectorAll(".email-item").forEach((el) => {
        el.addEventListener("click", () => {
          selectedEmail = el.getAttribute("data-email") || "";
          setFocusedMode(true);
          loadMessages(selectedEmail);
          renderEmails(inbox);
        });
      });
    }

    function setProfile(user) {
      const displayName = user && user.displayName ? user.displayName : "Inbox User";
      userLineEl.textContent = displayName;

      const initials = displayName
        .split(/\s+/)
        .filter(Boolean)
        .slice(0, 2)
        .map((p) => p[0].toUpperCase())
        .join("") || "U";

      profileAvatarFallbackEl.textContent = initials;

      if (user && user.photoUrl) {
        profileAvatarEl.src = user.photoUrl;
        profileAvatarEl.style.display = "block";
        profileAvatarFallbackEl.style.display = "none";
      } else {
        profileAvatarEl.removeAttribute("src");
        profileAvatarEl.style.display = "none";
        profileAvatarFallbackEl.style.display = "flex";
      }
    }

    function renderMessages(email, messages) {
      mailTitleEl.textContent = email || "Select an email";
      if (!messages.length) {
        mailsEl.innerHTML = '<div class="empty">No messages found for this address.</div>';
        return;
      }

      mailsEl.innerHTML = messages.map((m) => {
        const from = htmlEscape(m.from_address || "unknown");
        const subject = htmlEscape(m.subject || "(no subject)");
        const time = htmlEscape(m.received_at || m.created_at || "-");
        const body = htmlEscape((m.body || "(empty)").slice(0, 3000));
        return `
          <article class="mail">
            <h4>${subject}</h4>
            <div class="meta">From: ${from}<br/>Received: ${time}</div>
            <div class="body">${body}</div>
          </article>
        `;
      }).join("");
    }

    async function loadInbox() {
      if (!token) {
        emailsEl.innerHTML = '<div class="error">Missing token. Open this page from Telegram bot button.</div>';
        return;
      }

      try {
        const payload = await api("/api/webapp/inbox");
        setProfile(payload.user || {});
        const inbox = payload.inbox || [];
        renderEmails(inbox);
        if (selectedEmail) {
          await loadMessages(selectedEmail);
          setFocusedMode(true);
        } else {
          setFocusedMode(false);
          renderMessages("", []);
        }
      } catch (err) {
        emailsEl.innerHTML = `<div class="error">${htmlEscape(err.message)}</div>`;
        mailsEl.innerHTML = "";
      }
    }

    async function loadMessages(email) {
      try {
        const payload = await api(`/api/webapp/inbox/${encodeURIComponent(email)}`);
        renderMessages(payload.email, payload.messages || []);
      } catch (err) {
        mailsEl.innerHTML = `<div class="error">${htmlEscape(err.message)}</div>`;
      }
    }

    refreshBtn.addEventListener("click", loadInbox);
    backBtn.addEventListener("click", () => {
      selectedEmail = "";
      setFocusedMode(false);
      renderMessages("", []);
    });

    setFocusedMode(false);
    loadInbox();
  </script>
</body>
</html>
